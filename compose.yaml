services:
  ydb:
    image: ydbplatform/local-ydb:26.2.1.8
    environment:
      YDB_USE_IN_MEMORY_PDISKS: "1"
    ports:
      - "2135:2135"
      - "2136:2136"
      - "8765:8765"

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: >-
      sh -c "until npm run db:migrate; do sleep 2; done;
      exec npm run dev"
    environment:
      NODE_ENV: development
      PORT: 8000
      FRONTEND_ORIGIN: http://localhost:5173
      DATA_STORE: ydb
      YDB_CONNECTION_STRING: grpc://ydb:2136/local
      YDB_AUTH_MODE: anonymous
      MARKET_SOURCE: ${MARKET_SOURCE:-demo}
      HH_USER_AGENT: ${HH_USER_AGENT:-RynokRyadom/0.3 (local-development)}
      HH_ACCESS_TOKEN: ${HH_ACCESS_TOKEN:-}
      SUPERJOB_API_KEY: ${SUPERJOB_API_KEY:-}
      DEV_AUTH_ENABLED: "true"
      DEV_USER_ID: ${DEV_USER_ID:-local-user}
      DEV_USER_NAME: ${DEV_USER_NAME:-Ярослав}
    ports:
      - "8000:8000"
    depends_on:
      - ydb

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      VITE_PROXY_TARGET: http://backend:8000
    ports:
      - "5173:5173"
    depends_on:
      - backend

networks:
  default:
    driver_opts:
      com.docker.network.driver.mtu: "1400"
